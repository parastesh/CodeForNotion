<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چارت کندل‌استیک متاتریدر</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
        body { margin: 0; background: #0e0e10; color: #d1d4dc; }
        .version-badge {
            background: #f59e0b; color: #000; font-weight: bold;
            font-size: 11px; padding: 3px 8px; border-radius: 4px;
        }
        .header { display: flex; align-items: center; justify-content: space-between;
                  padding: 12px 20px; border-bottom: 1px solid #1e222d; flex-wrap: wrap; gap: 10px; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 9px 18px;
               border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: .2s; }
        .btn:hover { background: #1e53e5; }
        .tf-btn { background: transparent; color: #787b86; border: 1px solid #2a2e39;
                  padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .tf-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }
        #chart { width: 100%; height: 500px; }
        .legend { font-size: 13px; padding: 8px 20px; color: #787b86; direction: ltr; text-align: left; }
        .legend span { margin-inline-end: 14px; }
        .up { color: #26a69a; } .down { color: #ef5350; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn" onclick="document.getElementById('csvFile').click()">
                📂 انتخاب فایل CSV متاتریدر
            </button>
            <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
            <span class="version-badge">نسخه ۳.۰ (آپدیت جدید)</span>
        </div>
        <div style="display:flex; gap:6px;">
            <button class="tf-btn active" data-tf="60">M1</button>
            <button class="tf-btn" data-tf="300">M5</button>
            <button class="tf-btn" data-tf="900">M15</button>
            <button class="tf-btn" data-tf="3600">H1</button>
            <button class="tf-btn" data-tf="86400">D1</button>
        </div>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>

<script>
let chart, candleSeries, candles = [], timeScale = 60;

document.getElementById('csvFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    Papa.parse(file, {
        header: false,
        skipEmptyLines: true,
        complete: r => processCSV(r.data)
    });
});

function processCSV(rows) {
    if (!rows || rows.length < 2) {
        alert('نسخه ۳.۰: فایل شما خالی یا بسیار کوتاه است.');
        return;
    }

    let startIndex = 0;
    const firstRowStr = rows[0].join(' ').toLowerCase();
    if (firstRowStr.includes('open') || firstRowStr.includes('date') || firstRowStr.includes('time') || firstRowStr.includes('<')) {
        startIndex = 1;
    }

    candles = [];
    for (let i = startIndex; i < rows.length; i++) {
        const cols = rows[i];
        if (cols.length < 5) continue;

        let dateStr = '', timeStr = '00:00';
        let numIndices = [];

        cols.forEach((val) => {
            val = String(val).trim().replace(/["']/g, '');
            if (!dateStr && (val.includes('.') || val.includes('-') || val.includes('/')) && val.length >= 8) {
                dateStr = val.replace(/\./g, '-').replace(/\//g, '-');
            } else if (dateStr && timeStr === '00:00' && val.includes(':') && val.length <= 8) {
                timeStr = val;
            } else {
                let num = parseFloat(val);
                if (!isNaN(num)) {
                    numIndices.push(num);
                }
            }
        });

        if (numIndices.length >= 4) {
            const len = numIndices.length;
            const close = numIndices[len - 1];
            const low   = numIndices[len - 2];
            const high  = numIndices[len - 3];
            const open  = numIndices[len - 4];

            let ts;
            if (dateStr) {
                let fullDateTime = dateStr + 'T' + (timeStr.length === 5 ? timeStr : timeStr.slice(0,5)) + ':00Z';
                ts = Math.floor(new Date(fullDateTime).getTime() / 1000);
            }
            if (isNaN(ts) || !ts) {
                ts = Math.floor(Date.now() / 1000) - (rows.length - i) * 60;
            }

            candles.push({ time: ts, open, high, low, close });
        }
    }

    // مرتب‌سازی و حذف زمان‌های تکراری
    candles.sort((a, b) => a.time - b.time);
    candles = candles.filter((c, idx, arr) => idx === 0 || c.time > arr[idx - 1].time);

    if (candles.length > 0) {
        drawChart();
    } else {
        alert('نسخه ۳.۰: ساختار فایل خوانده نشد!\nخط اول فایل شما:\n' + JSON.stringify(rows[0]) + '\nخط دوم:\n' + JSON.stringify(rows[1]));
    }
}

function drawChart() {
    if (!chart) {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#0e0e10' }, textColor: '#787b86' },
            grid: {
                vertLines: { color: '#1a1c22' },
                horzLines: { color: '#1a1c22' }
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        chart.subscribeCrosshairMove(param => {
            const c = param.seriesData.get(candleSeries);
            const el = document.getElementById('legend');
            if (!c) { el.innerHTML = ''; return; }
            const cls = c.close >= c.open ? 'up' : 'down';
            el.innerHTML = `
                <span>${new Date(c.time * 1000).toISOString().slice(0,16).replace('T',' ')}</span>
                <span>O <b class="${cls}">${c.open}</b></span>
                <span>H <b class="${cls}">${c.high}</b></span>
                <span>L <b class="${cls}">${c.low}</b></span>
                <span>C <b class="${cls}">${c.close}</b></span>`;
        });
    }

    candleSeries.setData(candles);
    chart.timeScale().fitContent();
}

document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        timeScale = +btn.dataset.tf;
        if (candles.length) {
            candleSeries.setData(aggregate(candles, timeScale));
            chart.timeScale().fitContent();
        }
    });
});

function aggregate(data, sec) {
    if (sec <= 60) return data;
    const map = new Map();
    data.forEach(c => {
        const bucket = Math.floor(c.time / sec) * sec;
        if (!map.has(bucket)) map.set(bucket, { ...c, time: bucket });
        else {
            const b = map.get(bucket);
            b.high = Math.max(b.high, c.high);
            b.low  = Math.min(b.low, c.low);
            b.close = c.close;
        }
    });
    return [...map.values()].sort((a, b) => a.time - b.time);
}
</script>
</body>
</html>
