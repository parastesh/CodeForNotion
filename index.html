<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>چارت حرفه‌ای متاتریدر</title>

    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: Vazirmatn, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #131722;
            color: #d1d4dc;
        }

        .header {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 7px;
            padding: 8px 12px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
        }

        .group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            border: 0;
            border-radius: 6px;
            padding: 6px 11px;
            background: #2962ff;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: background .15s, opacity .15s;
        }

        .btn:hover {
            background: #1e53e5;
        }

        .btn.active {
            background: #089981;
        }

        .btn-success {
            background: #089981;
        }

        .btn-success:hover {
            background: #067a67;
        }

        .btn-warning {
            background: #f59e0b;
            color: #161616;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: #e53935;
        }

        .btn-danger:hover {
            background: #c62828;
        }

        .btn-dark {
            background: #363c4e;
        }

        .btn-dark:hover {
            background: #4b5268;
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: .42;
        }

        .tf-btn {
            padding: 4px 8px;
            border: 1px solid #363c4e;
            border-radius: 5px;
            background: transparent;
            color: #8b8e99;
            cursor: pointer;
            font-size: 11px;
        }

        .tf-btn.active {
            border-color: #2962ff;
            background: #2962ff;
            color: #fff;
        }

        .version-badge {
            padding: 4px 8px;
            border-radius: 4px;
            background: #8b5cf6;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }

        select,
        input[type="color"] {
            height: 29px;
            border: 1px solid #363c4e;
            border-radius: 5px;
            background: #2a2e39;
            color: #fff;
            font-size: 11px;
        }

        input[type="color"] {
            width: 35px;
            padding: 2px;
            cursor: pointer;
        }

        .legend {
            height: 25px;
            padding: 4px 12px;
            direction: ltr;
            text-align: left;
            background: #131722;
            color: #787b86;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
        }

        .legend span {
            margin-right: 12px;
        }

        .up {
            color: #089981;
        }

        .down {
            color: #f23645;
        }

        #status {
            color: #9ea2ad;
        }

        #chart-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 81px);
            direction: ltr;
        }

        #chart {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        #drawingCanvas {
            position: absolute;
            inset: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            touch-action: none;
        }

        #drawingCanvas.interactive {
            pointer-events: auto;
            cursor: default;
        }

        #drawingCanvas.drawing {
            cursor: crosshair;
        }
    </style>
</head>

<body>

<div class="header">

    <div class="group">
        <button class="btn" id="openCsvButton">📂 باز کردن CSV</button>
        <input type="file" id="csvFile" accept=".csv,.txt" hidden>

        <button class="btn btn-warning" id="updateCsvButton">
            🔄 آپدیت کندل‌ها
        </button>
        <input type="file" id="updateFile" accept=".csv,.txt" hidden>

        <span class="version-badge">نسخه ۵.۲</span>
    </div>

    <div class="group">
        <button class="btn" id="toolLineBtn">✏️ ترسیم خط</button>

        <select id="lineStyleSelect" title="نوع خط">
            <option value="solid">خط ساده</option>
            <option value="dashed">خط‌چین</option>
            <option value="dotted">نقطه‌چین</option>
        </select>

        <input
            type="color"
            id="lineColorPicker"
            value="#2962ff"
            title="رنگ خط"
        >

        <button class="btn btn-dark" id="duplicateLineButton" disabled>
            📑 کپی خط
        </button>

        <button class="btn btn-danger" id="deleteLineButton" disabled>
            🗑 حذف خط
        </button>

        <button class="btn btn-danger" id="clearLinesButton">
            پاک‌کردن خطوط
        </button>
    </div>

    <div class="group">
        <button class="btn btn-success" id="saveProjectButton">
            💾 ذخیره
        </button>

        <button class="btn" id="loadProjectButton">
            📂 بازیابی
        </button>
        <input type="file" id="loadProjectFile" accept=".json,.csv" hidden>

        <button class="btn" id="screenshotButton">
            📸 ذخیره تصویر
        </button>

        <button class="btn btn-danger" id="clearPageButton">
            ⚠ پاک‌کردن کل صفحه
        </button>
    </div>

    <div class="group">
        <button class="tf-btn active" data-tf="60">M1</button>
        <button class="tf-btn" data-tf="300">M5</button>
        <button class="tf-btn" data-tf="900">M15</button>
        <button class="tf-btn" data-tf="3600">H1</button>
        <button class="tf-btn" data-tf="86400">D1</button>
    </div>

</div>

<div class="legend" id="legend">
    <span id="status">برای شروع، فایل CSV را باز کنید.</span>
</div>

<div id="chart-container">
    <div id="chart"></div>
    <canvas id="drawingCanvas"></canvas>
</div>

<script>
    let chart = null;
    let candleSeries = null;

    let rawCandles = [];
    let currentTf = 60;

    let lines = [];
    let selectedLineIndex = null;

    let drawingMode = false;
    let pointerDown = false;
    let currentDrawingIndex = null;
    let dragMode = null;
    let lastDragPoint = null;

    let visibleCandles = [];

    const chartContainer =
        document.getElementById('chart-container');

    const canvas =
        document.getElementById('drawingCanvas');

    const ctx =
        canvas.getContext('2d');

    const statusElement =
        document.getElementById('status');

    const toolLineBtn =
        document.getElementById('toolLineBtn');

    const duplicateLineButton =
        document.getElementById('duplicateLineButton');

    const deleteLineButton =
        document.getElementById('deleteLineButton');

    const clearLinesButton =
        document.getElementById('clearLinesButton');

    const clearPageButton =
        document.getElementById('clearPageButton');

    const styleSelect =
        document.getElementById('lineStyleSelect');

    const colorPicker =
        document.getElementById('lineColorPicker');


    function setStatus(message) {
        statusElement.textContent = message;
    }


    function normalizeTime(time) {
        if (typeof time === 'number') {
            return time;
        }

        if (
            time &&
            typeof time === 'object' &&
            typeof time.year === 'number'
        ) {
            return Math.floor(
                Date.UTC(
                    time.year,
                    time.month - 1,
                    time.day
                ) / 1000
            );
        }

        return null;
    }


    function initChart() {
        if (chart) {
            return;
        }

        chart = LightweightCharts.createChart(
            document.getElementById('chart'),
            {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,

                layout: {
                    background: {
                        type: 'solid',
                        color: '#131722'
                    },
                    textColor: '#d1d4dc',
                    fontSize: 12
                },

                grid: {
                    vertLines: {
                        color: '#1e222d'
                    },
                    horzLines: {
                        color: '#1e222d'
                    }
                },

                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal
                },

                rightPriceScale: {
                    visible: true,
                    autoScale: true,
                    borderVisible: true,
                    borderColor: '#48505e',

                    entireTextOnly: false,

                    scaleMargins: {
                        top: 0.08,
                        bottom: 0.08
                    }
                },

                leftPriceScale: {
                    visible: false
                },

                timeScale: {
                    visible: true,
                    borderVisible: true,
                    borderColor: '#48505e',
                    timeVisible: true,
                    secondsVisible: false,
                    rightOffset: 4,
                    barSpacing: 7,
                    minBarSpacing: 0.5
                },

                handleScale: {
                    axisPressedMouseMove: {
                        time: true,
                        price: true
                    },
                    mouseWheel: true,
                    pinch: true
                },

                handleScroll: {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: true
                }
            }
        );

        candleSeries = chart.addCandlestickSeries({
            priceScaleId: 'right',

            upColor: '#089981',
            downColor: '#f23645',

            borderUpColor: '#089981',
            borderDownColor: '#f23645',

            wickUpColor: '#089981',
            wickDownColor: '#f23645',

            priceLineVisible: true,
            lastValueVisible: true,

            priceFormat: {
                type: 'price',
                precision: determinePrecision(rawCandles),
                minMove: determineMinMove(rawCandles)
            }
        });

        chart.subscribeCrosshairMove(handleCrosshairMove);

        chart.timeScale().subscribeVisibleLogicalRangeChange(
            redrawCanvas
        );

        chart.timeScale().subscribeVisibleTimeRangeChange(
            redrawCanvas
        );

        resizeChart();
    }


    function determinePrecision(data) {
        if (!data.length) {
            return 5;
        }

        const sample = data
            .slice(0, 100)
            .flatMap(item => [
                item.open,
                item.high,
                item.low,
                item.close
            ]);

        let precision = 2;

        sample.forEach(number => {
            const stringNumber =
                Number(number).toFixed(8).replace(/0+$/, '');

            const decimalPart =
                stringNumber.split('.')[1];

            if (decimalPart) {
                precision = Math.max(
                    precision,
                    decimalPart.length
                );
            }
        });

        return Math.min(precision, 8);
    }


    function determineMinMove(data) {
        const precision = determinePrecision(data);
        return Math.pow(10, -precision);
    }


    function updatePriceFormat() {
        if (!candleSeries) {
            return;
        }

        candleSeries.applyOptions({
            priceScaleId: 'right',
            priceLineVisible: true,
            lastValueVisible: true,

            priceFormat: {
                type: 'price',
                precision: determinePrecision(rawCandles),
                minMove: determineMinMove(rawCandles)
            }
        });

        chart.priceScale('right').applyOptions({
            visible: true,
            autoScale: true,
            borderVisible: true,
            entireTextOnly: false,
            scaleMargins: {
                top: 0.08,
                bottom: 0.08
            }
        });
    }


    function resizeChart() {
        if (!chart) {
            return;
        }

        const width =
            chartContainer.clientWidth;

        const height =
            chartContainer.clientHeight;

        chart.resize(width, height);

        const dpr =
            window.devicePixelRatio || 1;

        canvas.width =
            Math.floor(width * dpr);

        canvas.height =
            Math.floor(height * dpr);

        canvas.style.width =
            `${width}px`;

        canvas.style.height =
            `${height}px`;

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        redrawCanvas();
    }


    function applyData(fitContent = true) {
        initChart();

        visibleCandles =
            aggregate(rawCandles, currentTf);

        candleSeries.setData(visibleCandles);

        updatePriceFormat();

        if (fitContent && visibleCandles.length) {
            chart.timeScale().fitContent();
        }

        redrawCanvas();
    }


    function handleCrosshairMove(parameter) {
        if (
            !parameter ||
            !parameter.time ||
            !parameter.seriesData
        ) {
            return;
        }

        const candle =
            parameter.seriesData.get(candleSeries);

        if (!candle) {
            return;
        }

        const candleClass =
            candle.close >= candle.open
                ? 'up'
                : 'down';

        const timestamp =
            normalizeTime(parameter.time);

        const date =
            timestamp
                ? new Date(timestamp * 1000)
                    .toISOString()
                    .slice(0, 16)
                    .replace('T', ' ')
                : '';

        document.getElementById('legend').innerHTML = `
            <span>${date}</span>
            <span>O:
                <b class="${candleClass}">
                    ${candle.open}
                </b>
            </span>
            <span>H:
                <b class="${candleClass}">
                    ${candle.high}
                </b>
            </span>
            <span>L:
                <b class="${candleClass}">
                    ${candle.low}
                </b>
            </span>
            <span>C:
                <b class="${candleClass}">
                    ${candle.close}
                </b>
            </span>
        `;
    }


    function aggregate(data, seconds) {
        if (seconds <= 60) {
            return [...data];
        }

        const buckets = new Map();

        data.forEach(candle => {
            const bucketTime =
                Math.floor(candle.time / seconds) * seconds;

            if (!buckets.has(bucketTime)) {
                buckets.set(bucketTime, {
                    time: bucketTime,
                    open: candle.open,
                    high: candle.high,
                    low: candle.low,
                    close: candle.close
                });

                return;
            }

            const bucket =
                buckets.get(bucketTime);

            bucket.high =
                Math.max(bucket.high, candle.high);

            bucket.low =
                Math.min(bucket.low, candle.low);

            bucket.close =
                candle.close;
        });

        return [...buckets.values()]
            .sort((a, b) => a.time - b.time);
    }


    function getCanvasPoint(event) {
        const rect =
            canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }


    function chartPointFromCoordinate(x, y) {
        if (!chart || !candleSeries) {
            return null;
        }

        const rawTime =
            chart.timeScale().coordinateToTime(x);

        const time =
            normalizeTime(rawTime);

        const price =
            candleSeries.coordinateToPrice(y);

        if (
            time === null ||
            price === null ||
            !Number.isFinite(price)
        ) {
            return null;
        }

        return {
            time,
            price
        };
    }


    function coordinateFromChartPoint(time, price) {
        if (!chart || !candleSeries) {
            return null;
        }

        const x =
            chart.timeScale().timeToCoordinate(time);

        const y =
            candleSeries.priceToCoordinate(price);

        if (
            x === null ||
            y === null ||
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ) {
            return null;
        }

        return {
            x,
            y
        };
    }


    function distanceToSegment(point, start, end) {
        const dx =
            end.x - start.x;

        const dy =
            end.y - start.y;

        if (dx === 0 && dy === 0) {
            return Math.hypot(
                point.x - start.x,
                point.y - start.y
            );
        }

        const ratio =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        (point.x - start.x) * dx +
                        (point.y - start.y) * dy
                    ) / (dx * dx + dy * dy)
                )
            );

        const closestX =
            start.x + ratio * dx;

        const closestY =
            start.y + ratio * dy;

        return Math.hypot(
            point.x - closestX,
            point.y - closestY
        );
    }


    function hitTest(point) {
        for (
            let index = lines.length - 1;
            index >= 0;
            index--
        ) {
            const line = lines[index];

            const start =
                coordinateFromChartPoint(
                    line.time1,
                    line.price1
                );

            const end =
                coordinateFromChartPoint(
                    line.time2,
                    line.price2
                );

            if (!start || !end) {
                continue;
            }

            if (
                Math.hypot(
                    point.x - start.x,
                    point.y - start.y
                ) <= 10
            ) {
                return {
                    index,
                    part: 'start'
                };
            }

            if (
                Math.hypot(
                    point.x - end.x,
                    point.y - end.y
                ) <= 10
            ) {
                return {
                    index,
                    part: 'end'
                };
            }

            if (
                distanceToSegment(
                    point,
                    start,
                    end
                ) <= 8
            ) {
                return {
                    index,
                    part: 'line'
                };
            }
        }

        return null;
    }


    function setSelectedLine(index) {
        selectedLineIndex =
            Number.isInteger(index)
                ? index
                : null;

        const hasSelection =
            selectedLineIndex !== null &&
            lines[selectedLineIndex];

        duplicateLineButton.disabled =
            !hasSelection;

        deleteLineButton.disabled =
            !hasSelection;

        if (hasSelection) {
            styleSelect.value =
                lines[selectedLineIndex].style || 'solid';

            colorPicker.value =
                lines[selectedLineIndex].color || '#2962ff';

            setStatus(
                `خط شماره ${selectedLineIndex + 1} انتخاب شد.`
            );
        }

        redrawCanvas();
    }


    function setDrawingMode(enabled) {
        drawingMode = enabled;

        toolLineBtn.classList.toggle(
            'active',
            drawingMode
        );

        canvas.classList.toggle(
            'interactive',
            drawingMode || lines.length > 0
        );

        canvas.classList.toggle(
            'drawing',
            drawingMode
        );

        toolLineBtn.textContent =
            drawingMode
                ? '✅ ابزار خط فعال'
                : '✏️ ترسیم خط';

        setStatus(
            drawingMode
                ? 'روی چارت کلیک کنید، بکشید و رها کنید.'
                : 'ابزار ترسیم غیرفعال شد.'
        );
    }


    function syncCanvasInteractivity() {
        canvas.classList.toggle(
            'interactive',
            drawingMode || lines.length > 0
        );
    }


    function redrawCanvas() {
        const width =
            chartContainer.clientWidth;

        const height =
            chartContainer.clientHeight;

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        lines.forEach((line, index) => {
            const start =
                coordinateFromChartPoint(
                    line.time1,
                    line.price1
                );

            const end =
                coordinateFromChartPoint(
                    line.time2,
                    line.price2
                );

            if (!start || !end) {
                return;
            }

            ctx.save();

            ctx.strokeStyle =
                line.color || '#2962ff';

            ctx.lineWidth =
                index === selectedLineIndex
                    ? 3
                    : 2;

            ctx.lineCap = 'round';

            if (line.style === 'dashed') {
                ctx.setLineDash([10, 7]);
            } else if (line.style === 'dotted') {
                ctx.setLineDash([2, 6]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();

            if (index === selectedLineIndex) {
                drawAnchor(start);
                drawAnchor(end);
            }

            ctx.restore();
        });
    }


    function drawAnchor(point) {
        ctx.save();

        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(
            point.x,
            point.y,
            6,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#2962ff';
        ctx.stroke();

        ctx.restore();
    }


    canvas.addEventListener(
        'pointerdown',
        event => {
            if (!chart || !candleSeries) {
                return;
            }

            event.preventDefault();

            canvas.setPointerCapture(
                event.pointerId
            );

            pointerDown = true;

            const coordinate =
                getCanvasPoint(event);

            const chartPoint =
                chartPointFromCoordinate(
                    coordinate.x,
                    coordinate.y
                );

            if (!chartPoint) {
                pointerDown = false;
                return;
            }

            if (drawingMode) {
                const newLine = {
                    time1: chartPoint.time,
                    price1: chartPoint.price,
                    time2: chartPoint.time,
                    price2: chartPoint.price,
                    style: styleSelect.value,
                    color: colorPicker.value
                };

                lines.push(newLine);

                currentDrawingIndex =
                    lines.length - 1;

                setSelectedLine(
                    currentDrawingIndex
                );

                syncCanvasInteractivity();
                redrawCanvas();
                return;
            }

            const hit =
                hitTest(coordinate);

            if (!hit) {
                setSelectedLine(null);
                dragMode = null;
                pointerDown = false;
                return;
            }

            setSelectedLine(hit.index);

            dragMode = hit.part;

            lastDragPoint =
                chartPoint;
        }
    );


    canvas.addEventListener(
        'pointermove',
        event => {
            if (!pointerDown) {
                return;
            }

            event.preventDefault();

            const coordinate =
                getCanvasPoint(event);

            const chartPoint =
                chartPointFromCoordinate(
                    coordinate.x,
                    coordinate.y
                );

            if (!chartPoint) {
                return;
            }

            if (
                drawingMode &&
                currentDrawingIndex !== null
            ) {
                const line =
                    lines[currentDrawingIndex];

                line.time2 =
                    chartPoint.time;

                line.price2 =
                    chartPoint.price;

                redrawCanvas();
                return;
            }

            if (
                selectedLineIndex === null ||
                !dragMode
            ) {
                return;
            }

            const line =
                lines[selectedLineIndex];

            if (dragMode === 'start') {
                line.time1 =
                    chartPoint.time;

                line.price1 =
                    chartPoint.price;
            } else if (dragMode === 'end') {
                line.time2 =
                    chartPoint.time;

                line.price2 =
                    chartPoint.price;
            } else if (
                dragMode === 'line' &&
                lastDragPoint
            ) {
                const deltaTime =
                    chartPoint.time -
                    lastDragPoint.time;

                const deltaPrice =
                    chartPoint.price -
                    lastDragPoint.price;

                line.time1 += deltaTime;
                line.time2 += deltaTime;

                line.price1 += deltaPrice;
                line.price2 += deltaPrice;

                lastDragPoint =
                    chartPoint;
            }

            redrawCanvas();
        }
    );


    function finishPointer(event) {
        if (
            canvas.hasPointerCapture &&
            canvas.hasPointerCapture(event.pointerId)
        ) {
            canvas.releasePointerCapture(
                event.pointerId
            );
        }

        pointerDown = false;
        currentDrawingIndex = null;
        dragMode = null;
        lastDragPoint = null;

        redrawCanvas();
    }


    canvas.addEventListener(
        'pointerup',
        finishPointer
    );

    canvas.addEventListener(
        'pointercancel',
        finishPointer
    );


    function duplicateSelectedLine() {
        if (
            selectedLineIndex === null ||
            !lines[selectedLineIndex]
        ) {
            alert('ابتدا یک خط را انتخاب کنید.');
            return;
        }

        const original =
            lines[selectedLineIndex];

        const visibleRange =
            chart.timeScale().getVisibleRange();

        let timeOffset =
            currentTf * 5;

        if (
            visibleRange &&
            normalizeTime(visibleRange.from) !== null &&
            normalizeTime(visibleRange.to) !== null
        ) {
            timeOffset =
                Math.max(
                    currentTf,
                    Math.round(
                        (
                            normalizeTime(visibleRange.to) -
                            normalizeTime(visibleRange.from)
                        ) * 0.015
                    )
                );
        }

        let priceOffset =
            Math.abs(
                original.price2 -
                original.price1
            ) * 0.12;

        if (!priceOffset) {
            const referencePrice =
                Math.max(
                    Math.abs(original.price1),
                    1
                );

            priceOffset =
                referencePrice * 0.003;
        }

        const duplicate = {
            time1:
                original.time1 + timeOffset,

            price1:
                original.price1 + priceOffset,

            time2:
                original.time2 + timeOffset,

            price2:
                original.price2 + priceOffset,

            style:
                original.style,

            color:
                original.color
        };

        lines.push(duplicate);

        setSelectedLine(
            lines.length - 1
        );

        syncCanvasInteractivity();

        setStatus('یک کپی از خط ساخته شد.');
    }


    function deleteSelectedLine() {
        if (
            selectedLineIndex === null ||
            !lines[selectedLineIndex]
        ) {
            alert('ابتدا یک خط را انتخاب کنید.');
            return;
        }

        lines.splice(
            selectedLineIndex,
            1
        );

        setSelectedLine(null);
        syncCanvasInteractivity();

        setStatus('خط انتخاب‌شده حذف شد.');
    }


    function clearAllLines() {
        if (!lines.length) {
            setStatus('خطی برای حذف وجود ندارد.');

        if (
            !confirm(

            )
        ) {

        }

        lines = [];

        setSelectedLine(null);
        syncCanvasInteractivity();
        redrawCanvas();

        setStatus('همه خطوط پاک شدند.');
    }


    function clearEntirePage() {
        if (

            !lines.length
        ) {

        if (

        rawCandles = [];
        visibleCandles = [];

        }

        redrawCanvas();

        setStatus(
            'تمام صفحه شامل کندل‌ها و ترسیمات پاک شد.'

    }

    document.addEventListener(

            const targetTag =
                event.target.tagName.toLowerCase();

            if (
                targetTag === 'input' ||
                targetTag === 'select' ||
                targetTag === 'textarea'
            ) {
                return;
            }

            if (
                event.key === 'Delete' ||
                event.key === 'Backspace'
            ) {
                event.preventDefault();
                deleteSelectedLine();
            }

            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === 'd'
            ) {

            if (event.key === 'Escape') {

    function handleCsvFile(event, updateOnly) {
        const input =
            event.target;

        const file =
            input.files[0];

        if (!file) {
            return;
        }

        Papa.parse(file, {
            header: false,
            skipEmptyLines: true,

            complete: result => {
                parseMetaTraderRows(
                    result.data,
                    updateOnly
                );

                input.value = '';
            },

            error: error => {
                alert(
                    `خطا در خواندن فایل: ${error.message}`
                );

                input.value = '';
            }
        });
    }


    function parseMetaTraderRows(rows, updateOnly) {
        if (!rows || rows.length < 1) {
            alert('فایل خالی است.');
            return;
        }

        const normalizedHeader =
            rows[0].map(value =>
                String(value)
                    .trim()
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, '')
            );

        const hasHeader =
            normalizedHeader.some(
                value =>
                    value.includes('open') ||
                    value.includes('high') ||
                    value.includes('close') ||
                    value.includes('date')
            );

        let dateIndex = 0;
        let timeIndex = -1;
        let openIndex = -1;
        let highIndex = -1;
        let lowIndex = -1;
        let closeIndex = -1;

        if (hasHeader) {
            normalizedHeader.forEach(
                (column, index) => {
                    if (
                        column === 'open' ||
                        column === 'o'
                    ) {
                        openIndex = index;
                    } else if (
                        column === 'high' ||
                        column === 'h'
                    ) {
                        highIndex = index;
                    } else if (
                        column === 'low' ||
                        column === 'l'
                    ) {
                        lowIndex = index;
                    } else if (
                        column === 'close' ||
                        column === 'c'
                    ) {
                        closeIndex = index;
                    } else if (
                        column.includes('date')
                    ) {
                        dateIndex = index;
                    } else if (
                        column.includes('time')
                    ) {
                        timeIndex = index;
                    }
                }
            );
        }

        const firstDataRow =
            rows[hasHeader ? 1 : 0] || [];

        if (
            openIndex < 0 ||
            highIndex < 0 ||
            lowIndex < 0 ||
            closeIndex < 0
        ) {
            if (
                firstDataRow[1] &&
                String(firstDataRow[1]).includes(':')
            ) {
                dateIndex = 0;
                timeIndex = 1;
                openIndex = 2;
                highIndex = 3;
                lowIndex = 4;
                closeIndex = 5;
            } else {
                dateIndex = 0;
                timeIndex = -1;
                openIndex = 1;
                highIndex = 2;
                lowIndex = 3;
                closeIndex = 4;
            }
        }

        const startRow =
            hasHeader ? 1 : 0;

        let newCandles = [];

        for (
            let index = startRow;
            index < rows.length;
            index++
        ) {
            const row = rows[index];

            const requiredIndex =
                Math.max(
                    openIndex,
                    highIndex,
                    lowIndex,
                    closeIndex,
                    dateIndex,
                    timeIndex
                );

            if (row.length <= requiredIndex) {
                continue;
            }

            const open =
                Number.parseFloat(row[openIndex]);

            const high =
                Number.parseFloat(row[highIndex]);

            const low =
                Number.parseFloat(row[lowIndex]);

            const close =
                Number.parseFloat(row[closeIndex]);

            if (
                ![open, high, low, close]
                    .every(Number.isFinite)
            ) {
                continue;
            }

            const timestamp =
                parseDateTime(
                    row[dateIndex],
                    timeIndex >= 0
                        ? row[timeIndex]
                        : null,
                    index
                );

            newCandles.push({
                time: timestamp,
                open,
                high: Math.max(
                    open,
                    high,
                    low,
                    close
                ),
                low: Math.min(
                    open,
                    high,
                    low,
                    close
                ),
                close
            });
        }

        newCandles =
            sortAndDeduplicate(newCandles);

        if (!newCandles.length) {
            alert(
                'هیچ داده معتبر OHLC در فایل پیدا نشد.'
            );

            return;
        }

        if (updateOnly) {
            /*
             * ادغام بر اساس زمان:
             * کندل‌های جدید جایگزین کندل‌های هم‌زمان می‌شوند.
             * خطوط حذف یا جابه‌جا نمی‌شوند.
             */
            const candleMap =
                new Map(
                    rawCandles.map(candle => [
                        candle.time,
                        candle
                    ])
                );

            newCandles.forEach(candle => {
                candleMap.set(
                    candle.time,
                    candle
                );
            });

            rawCandles =
                sortAndDeduplicate(
                    [...candleMap.values()]
                );

            applyData(false);

            setStatus(
                `${newCandles.length} کندل دریافت شد؛ ترسیمات حفظ شدند.`
            );
        } else {
            rawCandles =
                newCandles;

            /*
             * باز کردن فایل جدید، کندل‌ها را عوض می‌کند
             * ولی ترسیمات موجود را حذف نمی‌کند.
             */
            applyData(true);

            setStatus(
                `${rawCandles.length} کندل بارگذاری شد.`
            );
        }
    }


    function parseDateTime(
        rawDate,
        rawTime,
        fallbackIndex
    ) {
        let dateText =
            String(rawDate ?? '').trim();

        let timeText =
            rawTime !== null &&
            rawTime !== undefined
                ? String(rawTime).trim()
                : '';

        dateText =
            dateText
                .replace(/\./g, '-')
                .replace(/\//g, '-');

        if (
            !timeText &&
            dateText.includes(' ')
        ) {
            const parts =
                dateText.split(/\s+/);

            dateText =
                parts[0];

            timeText =
                parts.slice(1).join(' ');
        }

        if (
            !timeText &&
            dateText.includes('T')
        ) {
            const milliseconds =
                Date.parse(dateText);

            if (Number.isFinite(milliseconds)) {
                return Math.floor(
                    milliseconds / 1000
                );
            }
        }

        if (!timeText) {
            timeText = '00:00:00';
        }

        if (/^\d{1,2}:\d{2}$/.test(timeText)) {
            timeText += ':00';
        }

        let milliseconds =
            Date.parse(
                `${dateText}T${timeText}Z`
            );

        if (!Number.isFinite(milliseconds)) {
            milliseconds =
                Date.parse(
                    `${dateText} ${timeText} UTC`
                );
        }

        if (!Number.isFinite(milliseconds)) {
            return 1600000000 +
                fallbackIndex * 60;
        }

        return Math.floor(
            milliseconds / 1000
        );
    }


    function sortAndDeduplicate(data) {
        data.sort(
            (a, b) => a.time - b.time
        );

        const map =
            new Map();

        data.forEach(candle => {
            map.set(
                candle.time,
                candle
            );
        });

        return [...map.values()]
            .sort((a, b) => a.time - b.time);
    }


    document.querySelectorAll('.tf-btn')
        .forEach(button => {
            button.addEventListener(
                'click',
                () => {
                    document.querySelectorAll('.tf-btn')
                        .forEach(item =>
                            item.classList.remove('active')
                        );

                    button.classList.add('active');

                    currentTf =
                        Number(button.dataset.tf);

                    applyData(true);
                }
            );
        });


    function saveProject() {
        if (
            !rawCandles.length &&
            !lines.length
        ) {
            alert('اطلاعاتی برای ذخیره وجود ندارد.');
            return;
        }

        /*
         * ذخیره پروژه به‌صورت CSV واقعی:
         * هر ردیف دارای نوع CANDLE یا LINE است.
         */
        const rows = [[
            'record_type',
            'time',
            'open',
            'high',
            'low',
            'close',
            'line_id',
            'time1',
            'price1',
            'time2',
            'price2',
            'style',
            'color',
            'timeframe'
        ]];

        rawCandles.forEach(candle => {
            rows.push([
                'CANDLE',
                candle.time,
                candle.open,
                candle.high,
                candle.low,
                candle.close,
                '',
                '',
                '',
                '',
                '',
                '',
                '',
                currentTf
            ]);
        });

        lines.forEach((line, index) => {
            rows.push([
                'LINE',
                '',
                '',
                '',
                '',
                '',
                index + 1,
                line.time1,
                line.price1,
                line.time2,
                line.price2,
                line.style,
                line.color,
                currentTf
            ]);
        });

        const csv =
            Papa.unparse(rows);

        const blob =
            new Blob(
                ['\uFEFF' + csv],
                {
                    type:
                        'text/csv;charset=utf-8;'
                }
            );

        downloadBlob(
            blob,
            `trader-project-${Date.now()}.csv`
        );

        setStatus(
            'پروژه شامل کندل‌ها و خطوط در فایل CSV ذخیره شد.'
        );
    }


    document.getElementById('loadProjectFile')
        .addEventListener(
            'change',
            event => {
                const input =
                    event.target;

                const file =
                    input.files[0];

                if (!file) {
                    return;
                }

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,

                    complete: result => {
                        restoreProjectRows(
                            result.data
                        );

                        input.value = '';
                    },

                    error: error => {
                        alert(
                            `خطا در بازیابی پروژه: ${error.message}`
                        );

                        input.value = '';
                    }
                });
            }
        );


    function restoreProjectRows(rows) {
        const restoredCandles = [];
        const restoredLines = [];

        let restoredTf =
            currentTf;

        rows.forEach(row => {
            const recordType =
                String(
                    row.record_type || ''
                ).trim().toUpperCase();

            if (recordType === 'CANDLE') {
                const candle = {
                    time:
                        Number(row.time),

                    open:
                        Number(row.open),

                    high:
                        Number(row.high),

                    low:
                        Number(row.low),

                    close:
                        Number(row.close)
                };

                if (
                    Object.values(candle)
                        .every(Number.isFinite)
                ) {
                    restoredCandles.push(candle);
                }
            }

            if (recordType === 'LINE') {
                const line = {
                    time1:
                        Number(row.time1),

                    price1:
                        Number(row.price1),

                    time2:
                        Number(row.time2),

                    price2:
                        Number(row.price2),

                    style:
                        row.style || 'solid',

                    color:
                        row.color || '#2962ff'
                };

                if (
                    [
                        line.time1,
                        line.price1,
                        line.time2,
                        line.price2
                    ].every(Number.isFinite)
                ) {
                    restoredLines.push(line);
                }
            }

            const parsedTf =
                Number(row.timeframe);

            if (Number.isFinite(parsedTf)) {
                restoredTf = parsedTf;
            }
        });

        if (
            !restoredCandles.length &&
            !restoredLines.length
        ) {
            alert(
                'فایل پروژه معتبر نیست یا داده‌ای ندارد.'
            );

            return;
        }

        rawCandles =
            sortAndDeduplicate(
                restoredCandles
            );

        lines =
            restoredLines;

        currentTf =
            restoredTf;

        document.querySelectorAll('.tf-btn')
            .forEach(button => {
                button.classList.toggle(
                    'active',
                    Number(button.dataset.tf) === currentTf
                );
            });

        setSelectedLine(null);
        syncCanvasInteractivity();

        applyData(true);

        setStatus(
            `${rawCandles.length} کندل و ${lines.length} خط بازیابی شد.`
        );
    }


    function takeScreenshot() {
        if (!chart) {
            alert('ابتدا یک چارت باز کنید.');
            return;
        }

        /*
         * Lightweight Charts فقط خود چارت را عکس می‌گیرد؛
         * بنابراین تصویر چارت و Canvas خطوط ترکیب می‌شوند.
         */
        const chartCanvas =
            chart.takeScreenshot();

        const width =
            chartContainer.clientWidth;

        const height =
            chartContainer.clientHeight;

        const dpr =
            window.devicePixelRatio || 1;

        const output =
            document.createElement('canvas');

        output.width =
            Math.floor(width * dpr);

        output.height =
            Math.floor(height * dpr);

        const outputContext =
            output.getContext('2d');

        outputContext.drawImage(
            chartCanvas,
            0,
            0,
            output.width,
            output.height
        );

        outputContext.drawImage(
            canvas,
            0,
            0,
            output.width,
            output.height
        );

        output.toBlob(blob => {
            if (!blob) {
                alert('ساخت تصویر ناموفق بود.');
                return;
            }

            downloadBlob(
                blob,
                `chart-${Date.now()}.png`
            );

            setStatus('تصویر چارت ذخیره شد.');
        }, 'image/png');
    }


    function downloadBlob(blob, fileName) {
        const url =
            URL.createObjectURL(blob);

        const anchor =
            document.createElement('a');

        anchor.href =
            url;

        anchor.download =
            fileName;

        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();

        setTimeout(
            () => URL.revokeObjectURL(url),
            1000
        );
    }


    window.addEventListener(
        'resize',
        resizeChart
    );


    /*
     * از همان ابتدا چارت ایجاد می‌شود تا نوار قیمت راست
     * همیشه قابل مشاهده باشد.
     */
    initChart();
    syncCanvasInteractivity();

</script>
