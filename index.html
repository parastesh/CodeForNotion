<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چارت کندل‌استیک متاتریدر</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
        body { margin: 0; background: #131722; color: #d1d4dc; overflow: hidden; }
        .version-badge {
            background: #10b981; color: #fff; font-weight: bold;
            font-size: 11px; padding: 4px 8px; border-radius: 4px;
        }
        .header { display: flex; align-items: center; justify-content: space-between;
                  padding: 10px 16px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 8px; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 7px 14px;
               border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: .2s; }
        .btn:hover { background: #1e53e5; }
        .tf-btn { background: transparent; color: #787b86; border: 1px solid #2a2e39;
                  padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .tf-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }
        #chart { width: 100vw; height: calc(100vh - 85px); }
        .legend { font-size: 13px; padding: 6px 16px; background: #131722; color: #787b86; direction: ltr; text-align: left; }
        .legend span { margin-inline-end: 14px; }
        .up { color: #089981; } .down { color: #f23645; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn" onclick="document.getElementById('csvFile').click()">
                📂 انتخاب فایل CSV متاتریدر
            </button>
            <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
            <span class="version-badge">نسخه ۴.۰ (اصلاح قیمت OHLC)</span>
        </div>
        <div style="display:flex; gap:6px;">
            <button class="tf-btn active" data-tf="60">M1</button>
            <button class="tf-btn" data-tf="300">M5</button>
            <button class="tf-btn" data-tf="900">M15</button>
            <button class="tf-btn" data-tf="3600">H1</button>
            <button class="tf-btn" data-tf="86400">D1</button>
        </div>
    </div>
    <div class="legend" id="legend">نشانگر ماوس را روی چارت ببرید تا اطلاعات کندل نمایش داده شود</div>
    <div id="chart"></div>

<script>
let chart, candleSeries, rawCandles = [], currentTf = 60;

document.getElementById('csvFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    Papa.parse(file, {
        header: false,
        skipEmptyLines: true,
        complete: r => parseMetaTraderData(r.data)
    });
});

function parseMetaTraderData(rows) {
    if (!rows || rows.length < 2) {
        alert('فایل خالی یا فاقد داده است.');
        return;
    }

    // بررسی اینکه آیا سطر اول شامل کلمات هدر است یا نه
    let hasHeader = false;
    let headerRow = rows[0].map(c => String(c).trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (headerRow.some(c => c.includes('open') || c.includes('date') || c.includes('time') || c.includes('close'))) {
        hasHeader = true;
    }

    let oIdx = -1, hIdx = -1, lIdx = -1, cIdx = -1, dIdx = -1, tIdx = -1;

    if (hasHeader) {
        headerRow.forEach((col, idx) => {
            if (col === 'open' || col === 'o') oIdx = idx;
            else if (col === 'high' || col === 'h') hIdx = idx;
            else if (col === 'low' || col === 'l') lIdx = idx;
            else if (col === 'close' || col === 'c') cIdx = idx;
            else if (col.includes('date')) dIdx = idx;
            else if (col.includes('time')) tIdx = idx;
        });
    }

    // اگر بر اساس نام هدر پیدا نشد، فرمت پیش‌فرض متاتریدر را اعمال کن:
    // ساختار استاندارد متاتریدر: Date(0), Time(1), Open(2), High(3), Low(4), Close(5)
    // یا Date+Time(0), Open(1), High(2), Low(3), Close(4)
    const testRow = rows[hasHeader ? 1 : 0];
    if (oIdx === -1 || hIdx === -1 || lIdx === -1 || cIdx === -1) {
        if (testRow[1] && String(testRow[1]).includes(':')) {
            // حالت دو ستون مجزا برای تاریخ و زمان
            dIdx = 0; tIdx = 1;
            oIdx = 2; hIdx = 3; lIdx = 4; cIdx = 5;
        } else {
            // حالت تاریخ و زمان چسبیده در ستون اول
            dIdx = 0; tIdx = -1;
            oIdx = 1; hIdx = 2; lIdx = 3; cIdx = 4;
        }
    }

    rawCandles = [];
    const startRow = hasHeader ? 1 : 0;

    for (let i = startRow; i < rows.length; i++) {
        const row = rows[i];
        if (row.length <= Math.max(oIdx, hIdx, lIdx, cIdx)) continue;

        let open = parseFloat(row[oIdx]);
        let high = parseFloat(row[hIdx]);
        let low  = parseFloat(row[lIdx]);
        let close = parseFloat(row[cIdx]);

        if (isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) continue;

        // پارس تاریخ و ساعت
        let datePart = String(row[dIdx]).trim().replace(/\./g, '-').replace(/\//g, '-');
        let timePart = (tIdx !== -1 && row[tIdx]) ? String(row[tIdx]).trim() : '00:00:00';
        if (timePart.length === 5) timePart += ':00';

        let isoString = datePart.includes('T') ? datePart : `${datePart}T${timePart}Z`;
        let ts = Math.floor(new Date(isoString).getTime() / 1000);

        // در صورت عدم تشخیص تاریخ دقیق، از گام زمانی یکنواخت استفاده می‌شود
        if (isNaN(ts)) {
            ts = 1600000000 + (i * 60);
        }

        // تضمین صحت روابط High و Low
        let actualHigh = Math.max(open, high, low, close);
        let actualLow  = Math.min(open, high, low, close);

        rawCandles.push({
            time: ts,
            open: open,
            high: actualHigh,
            low: actualLow,
            close: close
        });
    }

    // مرتب‌سازی بر اساس زمان و حذف داده‌های تکراری
    rawCandles.sort((a, b) => a.time - b.time);
    rawCandles = rawCandles.filter((c, idx, arr) => idx === 0 || c.time > arr[idx - 1].time);

    if (rawCandles.length > 0) {
        initChart();
        applyData();
    } else {
        alert('نسخه ۴.۰: داده‌های OHLC معتبر در فایل یافت نشدند.');
    }
}

function initChart() {
    if (!chart) {
        const container = document.getElementById('chart');
        chart = LightweightCharts.createChart(container, {
            layout: {
                background: { color: '#131722' },
                textColor: '#9ea2ad'
            },
            grid: {
                vertLines: { color: '#1e222d' },
                horzLines: { color: '#1e222d' }
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: {
                borderColor: '#2a2e39',
                autoScale: true
            },
            timeScale: {
                borderColor: '#2a2e39',
                timeVisible: true,
                secondsVisible: false
            }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#089981',
            downColor: '#f23645',
            borderUpColor: '#089981',
            borderDownColor: '#f23645',
            wickUpColor: '#089981',
            wickDownColor: '#f23645'
        });

        chart.subscribeCrosshairMove(param => {
            const el = document.getElementById('legend');
            if (!param.time || !param.seriesData.get(candleSeries)) {
                el.innerText = 'نشانگر ماوس را روی چارت ببرید تا اطلاعات کندل نمایش داده شود';
                return;
            }
            const c = param.seriesData.get(candleSeries);
            const cls = c.close >= c.open ? 'up' : 'down';
            const dateStr = new Date(c.time * 1000).toISOString().slice(0, 16).replace('T', ' ');
            el.innerHTML = `
                <span>${dateStr}</span>
                <span>O: <b class="${cls}">${c.open}</b></span>
                <span>H: <b class="${cls}">${c.high}</b></span>
                <span>L: <b class="${cls}">${c.low}</b></span>
                <span>C: <b class="${cls}">${c.close}</b></span>`;
        });

        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: window.innerWidth,
                height: window.innerHeight - 85
            });
        });
    }
}

function applyData() {
    if (!candleSeries) return;
    const data = aggregate(rawCandles, currentTf);
    candleSeries.setData(data);
    chart.timeScale().fitContent();
}

document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTf = +btn.dataset.tf;
        applyData();
    });
});

function aggregate(data, sec) {
    if (sec <= 60) return data;
    const map = new Map();
    data.forEach(c => {
        const bucket = Math.floor(c.time / sec) * sec;
        if (!map.has(bucket)) {
            map.set(bucket, { time: bucket, open: c.open, high: c.high, low: c.low, close: c.close });
        } else {
            const b = map.get(bucket);
            b.high = Math.max(b.high, c.high);
            b.low  = Math.min(b.low, c.low);
            b.close = c.close;
        }
    });
    return [...map.values()].sort((a, b) => a.time - b.time);
}
</script>
</body>
</html>
