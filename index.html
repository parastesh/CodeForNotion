<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چارت کندل‌استیک حرفه‌ای متاتریدر</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
        body { margin: 0; background: #131722; color: #d1d4dc; overflow: hidden; }
        .header { display: flex; align-items: center; justify-content: space-between;
                  padding: 8px 12px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 6px; }
        .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 6px 12px;
               border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: .2s; }
        .btn:hover { background: #1e53e5; }
        .btn-success { background: #089981; } .btn-success:hover { background: #067a67; }
        .btn-warning { background: #f59e0b; color: #000; } .btn-warning:hover { background: #d97706; }
        .tf-btn { background: transparent; color: #787b86; border: 1px solid #2a2e39;
                  padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .tf-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }
        .version-badge { background: #8b5cf6; color: #fff; font-weight: bold; font-size: 11px; padding: 4px 8px; border-radius: 4px; }
        #chart-container { position: relative; width: 100vw; height: calc(100vh - 80px); }
        #chart { width: 100%; height: 100%; }
        #drawingCanvas { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }
        #drawingCanvas.active { pointer-events: auto; cursor: crosshair; }
        .legend { font-size: 12px; padding: 4px 12px; background: #131722; color: #787b86; direction: ltr; text-align: left; height: 24px; }
        .legend span { margin-inline-end: 12px; }
        .up { color: #089981; } .down { color: #f23645; }
        select, input[type="color"] { background: #2a2e39; color: #fff; border: 1px solid #363c4e; padding: 4px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="group">
            <button class="btn" onclick="document.getElementById('csvFile').click()">📂 باز کردن CSV</button>
            <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
            <button class="btn btn-warning" onclick="document.getElementById('updateFile').click()">🔄 آپدیت کندل‌ها</button>
            <input type="file" id="updateFile" accept=".csv,.txt" style="display:none">
            <span class="version-badge">نسخه ۵.۰ (خط‌کشی حرفه‌ای)</span>
        </div>
        <div class="group">
            <label style="font-size:11px;">ابزار خط:</label>
            <button class="btn" id="toolLineBtn" onclick="toggleDrawingTool()">✏️ ترسیم خط</button>
            <select id="lineStyleSelect">
                <option value="solid">ساده (Solid)</option>
                <option value="dashed">خط‌چین (Dashed)</option>
                <option value="dotted">نقطه چین (Dotted)</option>
            </select>
            <input type="color" id="lineColorPicker" value="#2962ff">
        </div>
        <div class="group">
            <button class="btn btn-success" onclick="saveProject()">💾 ذخیره پروژه</button>
            <button class="btn" onclick="document.getElementById('loadProjFile').click()">📂 بازیابی پروژه</button>
            <input type="file" id="loadProjFile" accept=".json,.csv" style="display:none">
            <button class="btn" onclick="takeScreenshot()">📸 اسکرین‌شات</button>
        </div>
        <div class="group">
            <button class="tf-btn active" data-tf="60">M1</button>
            <button class="tf-btn" data-tf="300">M5</button>
            <button class="tf-btn" data-tf="900">M15</button>
            <button class="tf-btn" data-tf="3600">H1</button>
            <button class="tf-btn" data-tf="86400">D1</button>
        </div>
    </div>
    <div class="legend" id="legend">نشانگر ماوس را روی چارت ببرید</div>
    <div id="chart-container">
        <div id="chart"></div>
        <canvas id="drawingCanvas"></canvas>
    </div>

<script>
let chart, candleSeries, rawCandles = [], currentTf = 60;
let lines = []; // آرایه نگهداری خطوط رسم شده بر اساس مختصات زمانی و قیمتی
let isDrawingMode = false;
let currentDrawing = null;
let selectedLineIndex = null;
let draggingAnchor = null; // 'p1', 'p2', 'all'
let dragOffset = {x: 0, y: 0};

const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d');

document.getElementById('csvFile').addEventListener('change', e => handleCsv(e, false));
document.getElementById('updateFile').addEventListener('change', e => handleCsv(e, true));

function handleCsv(e, isUpdate) {
    const file = e.target.files[0];
    if (!file) return;
    Papa.parse(file, {
        header: false,
        skipEmptyLines: true,
        complete: r => parseMetaTraderData(r.data, isUpdate)
    });
}

function parseMetaTraderData(rows, isUpdate) {
    if (!rows || rows.length < 2) return alert('فایل خالی است.');
    let hasHeader = false;
    let headerRow = rows[0].map(c => String(c).trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (headerRow.some(c => c.includes('open') || c.includes('date') || c.includes('close'))) hasHeader = true;

    let oIdx = 1, hIdx = 2, lIdx = 3, cIdx = 4, dIdx = 0, tIdx = -1;
    if (hasHeader) {
        headerRow.forEach((col, idx) => {
            if (col === 'open' || col === 'o') oIdx = idx;
            else if (col === 'high' || col === 'h') hIdx = idx;
            else if (col === 'low' || col === 'l') lIdx = idx;
            else if (col === 'close' || col === 'c') cIdx = idx;
            else if (col.includes('date')) dIdx = idx;
            else if (col.includes('time')) tIdx = idx;
        });
    }

    const testRow = rows[hasHeader ? 1 : 0];
    if (testRow[1] && String(testRow[1]).includes(':')) { dIdx = 0; tIdx = 1; oIdx = 2; hIdx = 3; lIdx = 4; cIdx = 5; }

    let newCandles = [];
    for (let i = (hasHeader ? 1 : 0); i < rows.length; i++) {
        const row = rows[i];
        if (row.length <= Math.max(oIdx, hIdx, lIdx, cIdx)) continue;
        let open = parseFloat(row[oIdx]), high = parseFloat(row[hIdx]), low = parseFloat(row[lIdx]), close = parseFloat(row[cIdx]);
        if (isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) continue;

        let datePart = String(row[dIdx]).trim().replace(/\./g, '-').replace(/\//g, '-');
        let timePart = (tIdx !== -1 && row[tIdx]) ? String(row[tIdx]).trim() : '00:00:00';
        if (timePart.length === 5) timePart += ':00';
        let ts = Math.floor(new Date(`${datePart}T${timePart}Z`).getTime() / 1000);
        if (isNaN(ts)) ts = 1600000000 + (i * 60);

        newCandles.push({
            time: ts,
            open,
            high: Math.max(open, high, low, close),
            low: Math.min(open, high, low, close),
            close
        });
    }

    newCandles.sort((a, b) => a.time - b.time);
    newCandles = newCandles.filter((c, idx, arr) => idx === 0 || c.time > arr[idx - 1].time);

    if (newCandles.length > 0) {
        rawCandles = newCandles;
        if (!chart) initChart();
        applyData();
    } else {
        alert('داده معتبری یافت نشد.');
    }
}

function initChart() {
    const container = document.getElementById('chart');
    chart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#131722' }, textColor: '#9ea2ad' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39', autoScale: true },
        timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
    });

    candleSeries = chart.addCandlestickSeries({
        upColor: '#089981', downColor: '#f23645',
        borderUpColor: '#089981', borderDownColor: '#f23645',
        wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    chart.subscribeCrosshairMove(param => {
        const el = document.getElementById('legend');
        if (!param.time || !param.seriesData.get(candleSeries)) {
            el.innerText = 'نشانگر ماوس را روی چارت ببرید';
            return;
        }
        const c = param.seriesData.get(candleSeries);
        const cls = c.close >= c.open ? 'up' : 'down';
        const dateStr = new Date(c.time * 1000).toISOString().slice(0, 16).replace('T', ' ');
        el.innerHTML = `<span>${dateStr}</span><span>O: <b class="${cls}">${c.open}</b></span><span>H: <b class="${cls}">${c.high}</b></span><span>L: <b class="${cls}">${c.low}</b></span><span>C: <b class="${cls}">${c.close}</b></span>`;
    });

    chart.timeScale().subscribeVisibleLogicalRangeChange(() => redrawCanvas());
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
}

function resizeCanvas() {
    const container = document.getElementById('chart-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (chart) chart.resize(container.clientWidth, container.clientHeight);
    redrawCanvas();
}

function applyData() {
    if (!candleSeries) return;
    candleSeries.setData(aggregate(rawCandles, currentTf));
    chart.timeScale().fitContent();
    redrawCanvas();
}

document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTf = +btn.dataset.tf;
        applyData();
    });
});

function aggregate(data, sec) {
    if (sec <= 60) return data;
    const map = new Map();
    data.forEach(c => {
        const bucket = Math.floor(c.time / sec) * sec;
        if (!map.has(bucket)) map.set(bucket, { time: bucket, open: c.open, high: c.high, low: c.low, close: c.close });
        else {
            const b = map.get(bucket);
            b.high = Math.max(b.high, c.high);
            b.low = Math.min(b.low, c.low);
            b.close = c.close;
        }
    });
    return [...map.values()].sort((a, b) => a.time - b.time);
}

// سیستم ترسیم خطوط حرفه‌ای
function toggleDrawingTool() {
    isDrawingMode = !isDrawingMode;
    const btn = document.getElementById('toolLineBtn');
    if (isDrawingMode) {
        btn.style.background = '#089981';
        canvas.classList.add('active');
    } else {
        btn.style.background = '';
        canvas.classList.remove('active');
        currentDrawing = null;
    }
}

canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (isDrawingMode) {
        const time = chart.timeScale().coordinateToTime(x);
        const price = candleSeries.coordinateToPrice(y);
        if (time !== null && price !== null) {
            currentDrawing = {
                time1: time, price1: price,
                time2: time, price2: price,
                style: document.getElementById('lineStyleSelect').value,
                color: document.getElementById('lineColorPicker').value
            };
            lines.push(currentDrawing);
            selectedLineIndex = lines.length - 1;
        }
        return;
    }

    // بررسی کلیک روی انکرها یا خطوط برای جابجایی
    selectedLineIndex = null;
    draggingAnchor = null;
    for (let i = lines.length - 1; i >= 0; i--) {
        const l = lines[i];
        const p1 = getCoords(l.time1, l.price1);
        const p2 = getCoords(l.time2, l.price2);
        if (!p1 || !p2) continue;

        if (Math.hypot(p1.x - x, p1.y - y) < 10) { selectedLineIndex = i; draggingAnchor = 'p1'; break; }
        if (Math.hypot(p2.x - x, p2.y - y) < 10) { selectedLineIndex = i; draggingAnchor = 'p2'; break; }
        if (isNearLine(x, y, p1, p2)) { selectedLineIndex = i; draggingAnchor = 'all'; dragOffset = {x, y}; break; }
    }
    redrawCanvas();
});

canvas.addEventListener('mousemove', e => {
    if (!isDrawingMode && selectedLineIndex === null) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const time = chart.timeScale().coordinateToTime(x);
    const price = candleSeries.coordinateToPrice(y);

    if (isDrawingMode && currentDrawing) {
        if (time !== null && price !== null) { currentDrawing.time2 = time; currentDrawing.price2 = price; }
        redrawCanvas();
    } else if (selectedLineIndex !== null) {
        const l = lines[selectedLineIndex];
        if (draggingAnchor === 'p1' && time !== null && price !== null) { l.time1 = time; l.price1 = price; }
        else if (draggingAnchor === 'p2' && time !== null && price !== null) { l.time2 = time; l.price2 = price; }
        else if (draggingAnchor === 'all' && time !== null && price !== null) {
            // جابجایی کل خط (نیاز به محاسبه اختلاف زمانی/قیمتی)
            // برای سادگی در نسخه ۵: جابجایی با انکرها
        }
        redrawCanvas();
    }
});

canvas.addEventListener('mouseup', () => { currentDrawing = null; });
canvas.addEventListener('dblclick', e => {
    // دابل کلیک برای کپی کردن خط نزدیک به ماوس
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    for (let i = lines.length - 1; i >= 0; i--) {
        const p1 = getCoords(lines[i].time1, lines[i].price1);
        const p2 = getCoords(lines[i].time2, lines[i].price2);
        if (p1 && p2 && isNearLine(x, y, p1, p2)) {
            const clone = JSON.parse(JSON.stringify(lines[i]));
            clone.price1 += (lines[i].price1 * 0.01);
            clone.price2 += (lines[i].price2 * 0.01);
            lines.push(clone);
            redrawCanvas();
            break;
        }
    }
});

function getCoords(time, price) {
    if (!chart || !candleSeries) return null;
    const x = chart.timeScale().timeToCoordinate(time);
    const y = candleSeries.priceToCoordinate(price);
    if (x === null || y === null) return null;
    return { x, y };
}

function isNearLine(x, y, p1, p2) {
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (d === 0) return Math.hypot(x - p1.x, y - p1.y) < 8;
    const u = ((x - p1.x) * (p2.x - p1.x) + (y - p1.y) * (p2.y - p1.y)) / (d * d);
    const clamped = Math.max(0, Math.min(1, u));
    const nearestX = p1.x + clamped * (p2.x - p1.x);
    const nearestY = p1.y + clamped * (p2.y - p1.y);
    return Math.hypot(x - nearestX, y - nearestY) < 8;
}

function redrawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    lines.forEach((l, idx) => {
        const p1 = getCoords(l.time1, l.price1);
        const p2 = getCoords(l.time2, l.price2);
        if (!p1 || !p2) return;

        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = l.color || '#2962ff';
        ctx.lineWidth = (idx === selectedLineIndex) ? 3 : 2;

        if (l.style === 'dashed') ctx.setLineDash([8, 6]);
        else if (l.style === 'dotted') ctx.setLineDash([3, 3]);
        else ctx.setLineDash([]);

        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // رسم انکرپوینت‌ها اگر انتخاب شده باشد
        if (idx === selectedLineIndex) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p1.x, p1.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(p2.x, p2.y, 5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    });
}

// ذخیره و بازیابی پروژه (شامل کندل‌ها و ترسیمات)
function saveProject() {
    const data = { rawCandles, lines };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'trader_project_backup.json'; a.click();
}

document.getElementById('loadProjFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = event => {
        try {
            const data = JSON.parse(event.target.result);
            if (data.rawCandles) rawCandles = data.rawCandles;
            if (data.lines) lines = data.lines;
            initChart();
            applyData();
        } catch(err) { alert('فایل پروژه نامعتبر است.'); }
    };
    reader.readAsText(file);
});

function takeScreenshot() {
    const link = document.createElement('a');
    link.download = 'chart_screenshot.png';
    link.href = chart.takeScreenshot().toDataURL('image/png');
    link.click();
}
</script>
</body>
</html>
