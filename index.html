<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چارت کندل‌استیک متاتریدر</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background: #0e0e10; color: #d1d4dc; }
        .header { display: flex; align-items: center; justify-content: space-between;
                  padding: 14px 20px; border-bottom: 1px solid #1e222d; flex-wrap: wrap; gap: 10px; }
        .btn { background: #2962ff; color: #fff; border: none; padding: 10px 20px;
               border-radius: 8px; cursor: pointer; font-size: 14px; transition: .2s; }
        .btn:hover { background: #1e53e5; }
        .tf-btn { background: transparent; color: #787b86; border: 1px solid #2a2e39;
                  padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .tf-btn.active { background: #2962ff; color: #fff; border-color: #2962ff; }
        #chart { width: 100%; height: 520px; }
        .legend { font-size: 13px; padding: 10px 20px; color: #787b86; direction: ltr; text-align: left; }
        .legend span { margin-inline-end: 14px; }
        .up { color: #26a69a; } .down { color: #ef5350; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn" onclick="document.getElementById('csvFile').click()">
                📂 انتخاب فایل CSV متاتریدر
            </button>
            <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
        </div>
        <div style="display:flex; gap:6px;">
            <button class="tf-btn active" data-tf="60">M1</button>
            <button class="tf-btn" data-tf="300">M5</button>
            <button class="tf-btn" data-tf="900">M15</button>
            <button class="tf-btn" data-tf="3600">H1</button>
            <button class="tf-btn" data-tf="86400">D1</button>
        </div>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>

<script>
let chart, candleSeries, candles = [], timeScale = 60;

// ---------- خواندن فایل ----------
document.getElementById('csvFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: r => buildCandles(r.data)
    });
});

// ---------- تبدیل ردیف‌های متاتریدر به کندل ----------
function buildCandles(rows) {
    // پاکسازی کلیدها (حذف کاراکترهای اضافی مثل BOM و گیومه)
    const keys = Object.keys(rows[0]).map(k => k.replace(/["\uFEFF']/g, '').trim());
    const find = (names) => keys.find(k => names.some(n => k.toLowerCase().includes(n))) || null;

    const kDate  = find(['date']);
    const kTime  = find(['time']) && find(['date']) !== find(['time']) ? find(['time']) : null;
    const kOpen  = find(['open']);
    const kHigh  = find(['high']);
    const kLow   = find(['low']);
    const kClose = find(['close']) || kOpen; // اگر Close نبود، از Open استفاده کن

    candles = rows.map(row => {
        const get = key => key ? String(row[key] ?? row['"' + key + '"'] ?? '').replace(/["']/g, '').trim() : '';
        // تاریخ متاتریدر معمولاً 2024.01.15 است → به 2024-01-15 تبدیل می‌شود
        const d = get(kDate).replace(/\./g, '-');
        const t = kTime ? get(kTime) : '00:00';
        const ts = Math.floor(new Date(d + 'T' + (t.length === 5 ? t : t + ':00') + 'Z').getTime() / 1000);
        return {
            time: ts,
            open:  +get(kOpen),
            high:  +get(kHigh),
            low:   +get(kLow),
            close: +get(kClose)
        };
    })
    .filter(c => !isNaN(c.time) && !isNaN(c.close))
    .sort((a, b) => a.time - b.time);

    // حذف تکراری‌ها
    candles = candles.filter((c, i, arr) => i === 0 || c.time > arr[i-1].time);

    if (candles.length) drawChart();
    else alert('ستون‌های OHLC در فایل پیدا نشدند. مطمئن شوید خروجی از MetaTrader با گزینه Bars است.');
}

// ---------- رسم چارت ----------
function drawChart() {
    if (!chart) {
        chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#0e0e10' }, textColor: '#787b86' },
            grid: {
                vertLines: { color: '#1a1c22' },
                horzLines: { color: '#1a1c22' }
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // نمایش قیمت و رنگ کندل زیر نشانگر ماوس
        chart.subscribeCrosshairMove(param => {
            const c = param.seriesData.get(candleSeries);
            const el = document.getElementById('legend');
            if (!c) { el.innerHTML = ''; return; }
            const cls = c.close >= c.open ? 'up' : 'down';
            el.innerHTML = `
                <span>${new Date(c.time * 1000).toISOString().slice(0,16).replace('T',' ')}</span>
                <span>O <b class="${cls}">${c.open}</b></span>
                <span>H <b class="${cls}">${c.high}</b></span>
                <span>L <b class="${cls}">${c.low}</b></span>
                <span>C <b class="${cls}">${c.close}</b></span>`;
        });
    }

    candleSeries.setData(candles);
    chart.timeScale().fitContent();
}

// ---------- انتخاب تایم‌فریم نمایشی (فشرده‌سازی کندل‌ها) ----------
document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        timeScale = +btn.dataset.tf;
        if (candles.length) {
            candleSeries.setData(aggregate(candles, timeScale));
            chart.timeScale().fitContent();
        }
    });
});

// ادغام کندل‌های تکی در تایم‌فریم بزرگ‌تر (اگر فایل M1 باشد و H1 انتخاب شود)
function aggregate(data, sec) {
    if (sec <= 60) return data;
    const map = new Map();
    data.forEach(c => {
        const bucket = Math.floor(c.time / sec) * sec;
        if (!map.has(bucket)) map.set(bucket, { ...c, time: bucket });
        else {
            const b = map.get(bucket);
            b.high = Math.max(b.high, c.high);
            b.low  = Math.min(b.low, c.low);
            b.close = c.close;
        }
    });
    return [...map.values()].sort((a, b) => a.time - b.time);
}
</script>
</body>
</html>
