<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمودار کندل استیک متاتریدر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PapaParse برای خواندن CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <!-- FontAwesome برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas برای گرفتن اسکرین‌شات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- نوار ابزار بالا -->
    <header class="bg-[#1e1e1e] border-b border-[#333] px-4 py-2 flex flex-wrap items-center justify-between gap-3 shadow-md shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-base font-bold text-gray-200 flex items-center gap-2">
                <i class="fa-solid fa-chart-candlestick text-blue-500"></i> نمودار متاتریدر
            </h1>
            
            <label class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded cursor-pointer transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-upload"></i> آپلود CSV کندل
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
            </label>
        </div>

        <!-- ابزارهای ترسیم و مدیریت خطوط -->
        <div class="flex items-center flex-wrap gap-2 text-xs">
            <div class="flex items-center bg-[#2a2a2a] px-2 py-1 rounded border border-[#444] gap-2">
                <span class="text-gray-400">ابزار:</span>
                <button id="toolSelect" onclick="setDrawingTool('select')" class="px-2 py-1 rounded bg-blue-600 text-white transition"><i class="fa-solid fa-arrow-pointer"></i> انتخاب</button>
                <button id="toolLine" onclick="setDrawingTool('line')" class="px-2 py-1 rounded hover:bg-[#444] text-gray-300 transition"><i class="fa-solid fa-slash"></i> خط</button>
            </div>

            <!-- تنظیمات خط -->
            <div class="flex items-center bg-[#2a2a2a] px-2 py-1 rounded border border-[#444] gap-2">
                <input type="color" id="lineColor" value="#2196F3" class="w-6 h-6 bg-transparent border-0 cursor-pointer" title="رنگ خط">
                
                <select id="lineStyle" class="bg-[#1e1e1e] text-gray-200 border border-[#444] rounded px-1.5 py-1 text-xs">
                    <option value="solid">پیوسته</option>
                    <option value="dashed">خط‌چین</option>
                    <option value="dotted">نقطه‌چین</option>
                </select>
            </div>

            <!-- دکمه‌های عملیاتی روی خط انتخاب شده -->
            <div class="flex items-center gap-1">
                <button onclick="duplicateSelectedLine()" class="bg-gray-700 hover:bg-gray-600 text-white px-2.5 py-1.5 rounded transition flex items-center gap-1" title="کپی خط انتخاب شده (Ctrl+D)">
                    <i class="fa-solid fa-clone"></i> کپی خط
                </button>
                <button onclick="deleteSelectedLine()" class="bg-red-900/60 hover:bg-red-800 text-red-200 px-2.5 py-1.5 rounded transition flex items-center gap-1" title="حذف خط انتخاب شده (Delete)">
                    <i class="fa-solid fa-trash-can"></i> حذف خط
                </button>
            </div>

            <!-- پاکسازی‌ها -->
            <div class="flex items-center gap-1 border-r border-[#444] pr-2">
                <button onclick="clearDrawings()" class="bg-amber-900/60 hover:bg-amber-800 text-amber-200 px-2.5 py-1.5 rounded transition flex items-center gap-1" title="پاک کردن تمام خطوط ترسیمی">
                    <i class="fa-solid fa-eraser"></i> پاک کردن خطوط
                </button>
                <button onclick="clearEntirePage()" class="bg-red-700 hover:bg-red-600 text-white px-2.5 py-1.5 rounded transition flex items-center gap-1 font-bold" title="پاک کردن کل صفحه و تنظیمات">
                    <i class="fa-solid fa-rotate-left"></i> پاکسازی کل صفحه
                </button>
            </div>
        </div>

        <!-- ذخیره و خروجی -->
        <div class="flex items-center gap-2 text-xs">
            <button onclick="saveProject()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded transition flex items-center gap-1 shadow">
                <i class="fa-solid fa-file-arrow-down"></i> ذخیره پروژه (CSV)
            </button>
            
            <label class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded cursor-pointer transition flex items-center gap-1 shadow">
                <i class="fa-solid fa-file-arrow-up"></i> بارگذاری پروژه
                <input type="file" id="projectFileInput" accept=".csv" class="hidden">
            </label>

            <button onclick="takeScreenshot()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded transition flex items-center gap-1 shadow" title="گرفتن اسکرین‌شات از نمودار">
                <i class="fa-solid fa-camera"></i> اسکرین‌شات
            </button>
        </div>
    </header>

    <!-- ناحیه اصلی نمودار و بوم رسم خطوط -->
    <main id="chartContainer" class="flex-1 relative w-full overflow-hidden bg-[#121212]">
        <canvas id="drawingCanvas" class="absolute inset-0 z-10 w-full h-full"></canvas>
    </main>

    <!-- نوار وضعیت پایین -->
    <footer class="bg-[#1e1e1e] border-t border-[#333] px-4 py-1 text-xs text-gray-400 flex justify-between items-center shrink-0">
        <div id="statusText">آماده به کار. لطفاً فایل CSV خود را بارگذاری کنید.</div>
        <div>توسعهیافته برای متاتریدر | Lightweight Charts</div>
    </footer>

    <script>
        let chart, candlestickSeries;
        let candleData = [];
        let drawings = []; 
        let currentTool = 'select'; 
        let selectedLineIndex = null;
        let isDrawing = false;
        let startPoint = null;
        let currentMousePoint = null;
        let draggingLineIndex = null;
        let dragOffset = { x: 0, y: 0 };

        function initChart() {
            const container = document.getElementById('chartContainer');
            
            chart = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: '#121212' },
                    textColor: '#d1d5db',
                },
                grid: {
                    vertLines: { color: '#1e1e1e' },
                    horzLines: { color: '#1e1e1e' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#333',
                    visible: true,
                    scaleMargins: { top: 0.1, bottom: 0.2 },
                },
                timeScale: {
                    borderColor: '#333',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                redrawCanvas();
            });

            chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
                redrawCanvas();
            });

            setupCanvasEvents();
        }

        function resizeCanvas() {
            const container = document.getElementById('chartContainer');
            const canvas = document.getElementById('drawingCanvas');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            redrawCanvas();
        }

        // خواندن CSV کندل‌ها
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                delimiter: "", 
                skipEmptyLines: true,
                complete: function(results) {
                    processCSVData(results.data);
                },
                error: function(err) {
                    alert('خطا در خواندن فایل CSV: ' + err.message);
                }
            });
        });

        function processCSVData(rows) {
            let parsed = [];
            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                if (row.length < 5) continue;

                let dateStr = row[0]?.trim();
                let o, h, l, c;
                if (!isNaN(parseFloat(row[1])) && !isNaN(parseFloat(row[2]))) {
                    o = parseFloat(row[1]);
                    h = parseFloat(row[2]);
                    l = parseFloat(row[3]);
                    c = parseFloat(row[4]);
                } else if (!isNaN(parseFloat(row[2])) && !isNaN(parseFloat(row[3]))) {
                    dateStr = `${row[0]} ${row[1]}`;
                    o = parseFloat(row[2]);
                    h = parseFloat(row[3]);
                    l = parseFloat(row[4]);
                    c = parseFloat(row[5]);
                } else {
                    continue;
                }

                let timestamp;
                if (dateStr.includes('.')) {
                    let parts = dateStr.split(' ');
                    let datePart = parts[0].replace(/\./g, '-');
                    let timePart = parts[1] || '00:00:00';
                    timestamp = Math.floor(new Date(`${datePart}T${timePart}`).getTime() / 1000);
                } else {
                    timestamp = Math.floor(new Date(dateStr).getTime() / 1000);
                }

                if (!isNaN(timestamp) && !isNaN(o) && !isNaN(h) && !isNaN(l) && !isNaN(c)) {
                    parsed.push({ time: timestamp, open: o, high: h, low: l, close: c });
                }
            }

            if (parsed.length > 0) {
                parsed.sort((a, b) => a.time - b.time);
                candleData = parsed;
                candlestickSeries.setData(candleData);
                chart.timeScale().fitContent();
                document.getElementById('statusText').innerText = `تعداد ${candleData.length} کندل با موفقیت بارگذاری شد.`;
            } else {
                alert('فرمت ستون‌های OHLC در فایل یافت نشد.');
            }
        }

        function setDrawingTool(tool) {
            currentTool = tool;
            selectedLineIndex = null;
            
            document.getElementById('toolSelect').className = tool === 'select' ? 'px-2 py-1 rounded bg-blue-600 text-white transition' : 'px-2 py-1 rounded hover:bg-[#444] text-gray-300 transition';
            document.getElementById('toolLine').className = tool === 'line' ? 'px-2 py-1 rounded bg-blue-600 text-white transition' : 'px-2 py-1 rounded hover:bg-[#444] text-gray-300 transition';
            
            redrawCanvas();
        }

        function setupCanvasEvents() {
            const canvas = document.getElementById('drawingCanvas');

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (currentTool === 'line') {
                    isDrawing = true;
                    startPoint = { x, y };
                    currentMousePoint = { x, y };
                } else if (currentTool === 'select') {
                    let clickedIndex = findLineAt(x, y);
                    if (clickedIndex !== null) {
                        selectedLineIndex = clickedIndex;
                        draggingLineIndex = clickedIndex;
                        let line = drawings[clickedIndex];
                        let p1 = coordToPixel(line.time1, line.price1);
                        dragOffset = { x: x - p1.x, y: y - p1.y };
                    } else {
                        selectedLineIndex = null;
                    }
                    redrawCanvas();
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (isDrawing && currentTool === 'line') {
                    currentMousePoint = { x, y };
                    redrawCanvas();
                    drawTempLine(startPoint, currentMousePoint);
                } else if (currentTool === 'select' && draggingLineIndex !== null) {
                    let line = drawings[draggingLineIndex];
                    let p1Old = coordToPixel(line.time1, line.price1);
                    let p2Old = coordToPixel(line.time2, line.price2);
                    
                    let dx = x - dragOffset.x - p1Old.x;
                    let dy = y - dragOffset.y - p1Old.y;

                    let newP1 = { x: p1Old.x + dx, y: p1Old.y + dy };
                    let newP2 = { x: p2Old.x + dx, y: p2Old.y + dy };

                    let c1 = pixelToCoord(newP1.x, newP1.y);
                    let c2 = pixelToCoord(newP2.x, newP2.y);

                    if (c1.time && c2.time) {
                        line.time1 = c1.time;
                        line.price1 = c1.price;
                        line.time2 = c2.time;
                        line.price2 = c2.price;
                    }

                    dragOffset = { x: x - newP1.x, y: y - newP1.y };
                    redrawCanvas();
                }
            });

            canvas.addEventListener('mouseup', () => {
                if (isDrawing && currentTool === 'line' && startPoint && currentMousePoint) {
                    let c1 = pixelToCoord(startPoint.x, startPoint.y);
                    let c2 = pixelToCoord(currentMousePoint.x, currentMousePoint.y);

                    if (c1.time && c2.time) {
                        drawings.push({
                            time1: c1.time,
                            price1: c1.price,
                            time2: c2.time,
                            price2: c2.price,
                            color: document.getElementById('lineColor').value,
                            style: document.getElementById('lineStyle').value
                        });
                    }
                    isDrawing = false;
                    startPoint = null;
                    currentMousePoint = null;
                    setDrawingTool('select');
                    redrawCanvas();
                }
                draggingLineIndex = null;
            });
        }

        function coordToPixel(time, price) {
            const timeScale = chart.timeScale();
            const x = timeScale.timeToCoordinate(time);
            const y = candlestickSeries.priceToCoordinate(price);
            return { x: x !== null ? x : -100, y: y !== null ? y : -100 };
        }

        function pixelToCoord(x, y) {
            const timeScale = chart.timeScale();
            const time = timeScale.coordinateToTime(x);
            const price = candlestickSeries.coordinateToPrice(y);
            return { time, price };
        }

        function redrawCanvas() {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawings.forEach((line, index) => {
                let p1 = coordToPixel(line.time1, line.price1);
                let p2 = coordToPixel(line.time2, line.price2);

                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = line.color;
                ctx.lineWidth = (index === selectedLineIndex) ? 3 : 2;

                if (line.style === 'dashed') ctx.setLineDash([6, 6]);
                else if (line.style === 'dotted') ctx.setLineDash([2, 4]);
                else ctx.setLineDash([]);

                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                if (index === selectedLineIndex) {
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = 2;
                    [p1, p2].forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });
                }
                ctx.restore();
            });
        }

        function drawTempLine(p1, p2) {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = document.getElementById('lineColor').value;
            ctx.lineWidth = 2;
            
            let style = document.getElementById('lineStyle').value;
            if (style === 'dashed') ctx.setLineDash([6, 6]);
            else if (style === 'dotted') ctx.setLineDash([2, 4]);

            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.restore();
        }

        function findLineAt(x, y) {
            for (let i = drawings.length - 1; i >= 0; i--) {
                let line = drawings[i];
                let p1 = coordToPixel(line.time1, line.price1);
                let p2 = coordToPixel(line.time2, line.price2);
                let dist = distToSegment({x, y}, p1, p2);
                if (dist < 8) return i;
            }
            return null;
        }

        function distToSegment(p, p1, p2) {
            let l2 = (p2.x - p1.x)**2 + (p2.y - p1.y)**2;
            if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        // نسخه اصلاح‌شده و دقیق کپی خط با استفاده از آفست پیکسلی مستقیم
        function duplicateSelectedLine() {
            if (selectedLineIndex === null || !drawings[selectedLineIndex]) {
                alert('لطفاً ابتدا یک خط را روی نمودار انتخاب کنید.');
                return;
            }
            let original = drawings[selectedLineIndex];
            
            // تبدیل مختصات خط اصلی به پیکسل صفحه
            let p1 = coordToPixel(original.time1, original.price1);
            let p2 = coordToPixel(original.time2, original.price2);

            // ایجاد آفست پیکسلی مشخص (مثلا 35 پیکسل پایین‌تر و راست‌تر)
            let offsetPx = 35;
            let newP1 = pixelToCoord(p1.x + offsetPx, p1.y + offsetPx);
            let newP2 = pixelToCoord(p2.x + offsetPx, p2.y + offsetPx);

            let duplicated = {
                time1: newP1.time || original.time1,
                price1: newP1.price || original.price1,
                time2: newP2.time || original.time2,
                price2: newP2.price || original.price2,
                color: original.color,
                style: original.style
            };

            drawings.push(duplicated);
            selectedLineIndex = drawings.length - 1;
            redrawCanvas();
            document.getElementById('statusText').innerText = 'کپی خط با موفقیت ایجاد شد.';
        }

        function deleteSelectedLine() {
            if (selectedLineIndex === null) {
                alert('لطفاً ابتدا خطی را انتخاب کنید.');
                return;
            }
            drawings.splice(selectedLineIndex, 1);
            selectedLineIndex = null;
            redrawCanvas();
        }

        function clearDrawings() {
            if (confirm('آیا از پاک کردن تمام خطوط ترسیمی اطمینان دارید؟')) {
                drawings = [];
                selectedLineIndex = null;
                redrawCanvas();
            }
        }

        function clearEntirePage() {
            if (confirm('هشدار: کل صفحه، کندل‌ها و تمام خطوط پاک خواهند شد. ادامه می‌دهید؟')) {
                candleData = [];
                drawings = [];
                selectedLineIndex = null;
                candlestickSeries.setData([]);
                redrawCanvas();
                document.getElementById('statusText').innerText = 'صفحه کامل پاک شد.';
            }
        }

        function saveProject() {
            const projectData = { candles: candleData, drawings: drawings };
            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'trading_project.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('projectFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.candles) {
                        candleData = data.candles;
                        candlestickSeries.setData(candleData);
                        chart.timeScale().fitContent();
                    }
                    if (data.drawings) {
                        drawings = data.drawings;
                    }
                    redrawCanvas();
                    document.getElementById('statusText').innerText = 'پروژه با موفقیت بارگذاری شد.';
                } catch (err) {
                    alert('خطا در خواندن فایل پروژه.');
                }
            };
            reader.readAsText(file);
        });

        function takeScreenshot() {
            html2canvas(document.getElementById('chartContainer')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'chart_screenshot.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // میانبرهای صفحه کلید (حذف با Delete و کپی با Ctrl+D)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedLineIndex !== null) {
                    deleteSelectedLine();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
                e.preventDefault();
                duplicateSelectedLine();
            }
        });

        initChart();
    </script>
</body>
</html>
